[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrag"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
markers = ["integration: tests that call the live Gemini API"]
testpaths = ["tests"]
